[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["semana2"]
minversion = "7.0"
addopts = "--cov=semana2/src --cov-report=term-missing --cov-fail-under=80"
testpaths = ["semana2/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true